apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: grupo1222
  labels:
    app: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: mysql:latest
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "1234"
            - name: MYSQL_DATABASE
              value: "pi"
          ports:
            - containerPort: 3306
              name: db
          volumeMounts:
          - name: mysql-persistent-storage
            mountPath: /var/lib/mysql
      volumes:
      - name: mysql-persistent-storage
        persistentVolumeClaim:
          claimName: mysql-pvc
              
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: grupo1222
  labels:
    app: db
spec:
  selector:
    app: db
  ports:
  - port: 3306
    targetPort: 3306
  type: LoadBalancer
  loadBalancerIP: "34.172.40.142"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: grupo1222
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi